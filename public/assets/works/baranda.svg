<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Baranda metálica de hierro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191614"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff6700" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff6700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- top cap rail -->
  <line x1="120" y1="170" x2="680" y2="170" stroke="#ff6700" stroke-width="7" stroke-linecap="round"/>
  <!-- posts -->
  <g stroke="#c2c0ba" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="170" x2="160" y2="470"/>
    <line x1="330" y1="170" x2="330" y2="470"/>
    <line x1="500" y1="170" x2="500" y2="470"/>
    <line x1="670" y1="170" x2="670" y2="470"/>
  </g>
  <!-- horizontal infill rails -->
  <g stroke="#8f8d88" stroke-width="5" stroke-linecap="round">
    <line x1="160" y1="230" x2="670" y2="230"/>
    <line x1="160" y1="290" x2="670" y2="290"/>
    <line x1="160" y1="350" x2="670" y2="350"/>
    <line x1="160" y1="410" x2="670" y2="410"/>
  </g>
</svg>
