<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mesa industrial de hierro y madera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191614"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ff6700" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff6700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- wood top -->
  <rect x="170" y="250" width="460" height="40" rx="4" fill="none" stroke="#ff6700" stroke-width="5"/>
  <g stroke="#ff6700" stroke-width="2.5" opacity="0.5">
    <line x1="185" y1="264" x2="615" y2="264"/>
    <line x1="185" y1="276" x2="615" y2="276"/>
  </g>
  <!-- box legs -->
  <g fill="none" stroke="#c2c0ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 290 L210 470 M300 290 L300 470 M210 470 L300 470 M210 380 L300 380"/>
    <path d="M500 290 L500 470 M590 290 L590 470 M500 470 L590 470 M500 380 L590 380"/>
    <line x1="300" y1="430" x2="500" y2="430"/>
  </g>
</svg>
