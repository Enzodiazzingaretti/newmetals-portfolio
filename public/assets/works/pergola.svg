<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estructura pérgola">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191614"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ff6700" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff6700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- roof frame (isometric parallelogram) -->
  <path d="M150 200 L620 150 L680 220 L210 270 Z" fill="none" stroke="#c2c0ba" stroke-width="5" stroke-linejoin="round"/>
  <!-- slats -->
  <g stroke="#8f8d88" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="205" y1="207" x2="266" y2="277"/>
    <line x1="262" y1="201" x2="323" y2="271"/>
    <line x1="319" y1="195" x2="380" y2="265"/>
    <line x1="376" y1="189" x2="437" y2="259"/>
    <line x1="433" y1="183" x2="494" y2="253"/>
    <line x1="490" y1="177" x2="551" y2="247"/>
    <line x1="547" y1="171" x2="608" y2="241"/>
  </g>
  <!-- posts -->
  <g stroke="#c2c0ba" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="205" x2="175" y2="470"/>
    <line x1="612" y1="155" x2="627" y2="440"/>
    <line x1="675" y1="222" x2="690" y2="490"/>
  </g>
  <line x1="210" y1="268" x2="225" y2="500" stroke="#ff6700" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>
