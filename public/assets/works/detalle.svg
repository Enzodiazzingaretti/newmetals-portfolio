<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Detalle de cordón de soldadura">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191614"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a1e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff6700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- dos chapas que se encuentran en la junta -->
  <g fill="none" stroke="#c2c0ba" stroke-width="5">
    <rect x="90" y="140" width="620" height="150"/>
    <rect x="90" y="310" width="620" height="150"/>
  </g>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- cordón de soldadura: ripples solapados sobre la junta -->
  <g fill="none" stroke="#ff6700" stroke-width="6" stroke-linecap="round">
    <path d="M110 300 q15 -18 30 0 q15 18 30 0 q15 -18 30 0 q15 18 30 0 q15 -18 30 0
             q15 18 30 0 q15 -18 30 0 q15 18 30 0 q15 -18 30 0 q15 18 30 0
             q15 -18 30 0 q15 18 30 0 q15 -18 30 0 q15 18 30 0 q15 -18 30 0
             q15 18 30 0 q15 -18 30 0 q15 18 30 0 q15 -18 30 0" opacity="0.9"/>
  </g>
  <line x1="110" y1="300" x2="690" y2="300" stroke="#ffcf8a" stroke-width="2" opacity="0.55"/>
  <!-- chispas puntuales -->
  <g stroke="#ffb347" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="400" y1="300" x2="440" y2="250"/>
    <line x1="400" y1="300" x2="360" y2="255"/>
    <line x1="400" y1="300" x2="420" y2="360"/>
  </g>
</svg>
