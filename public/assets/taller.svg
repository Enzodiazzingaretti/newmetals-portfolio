<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soldadura de estructura metálica en el taller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1714"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ff8a1e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff6700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- banco de trabajo -->
  <g stroke="#8f8d88" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="90" y1="420" x2="710" y2="420"/>
    <line x1="90" y1="436" x2="710" y2="436"/>
    <line x1="140" y1="436" x2="140" y2="540"/>
    <line x1="660" y1="436" x2="660" y2="540"/>
    <line x1="140" y1="490" x2="660" y2="490" stroke-opacity="0.5"/>
  </g>

  <!-- viga I sobre el banco (alzado) -->
  <g stroke="#c2c0ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="150" y1="330" x2="440" y2="330"/>
    <line x1="150" y1="410" x2="440" y2="410"/>
    <line x1="165" y1="330" x2="165" y2="410"/>
    <line x1="425" y1="330" x2="425" y2="410"/>
  </g>
  <!-- pieza que llega en diagonal a la junta -->
  <g stroke="#c2c0ba" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="440" y1="370" x2="640" y2="220"/>
    <line x1="463" y1="392" x2="663" y2="242"/>
    <line x1="640" y1="220" x2="663" y2="242"/>
  </g>
  <!-- prensa sargento sujetando la viga -->
  <g stroke="#8f8d88" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M300 300 L300 260 L336 260 L336 300"/>
    <line x1="318" y1="260" x2="318" y2="236"/>
    <circle cx="318" cy="228" r="8"/>
  </g>

  <!-- cotas de plano -->
  <g stroke="#ff6700" stroke-width="2" stroke-opacity="0.55" fill="none">
    <line x1="150" y1="470" x2="440" y2="470"/>
    <line x1="150" y1="462" x2="150" y2="478"/>
    <line x1="440" y1="462" x2="440" y2="478"/>
  </g>
  <g stroke="#ff6700" stroke-width="2" stroke-opacity="0.55" fill="none">
    <line x1="720" y1="220" x2="720" y2="410"/>
    <line x1="712" y1="220" x2="728" y2="220"/>
    <line x1="712" y1="410" x2="728" y2="410"/>
  </g>

  <!-- junta soldada: glow + chispas -->
  <circle cx="452" cy="381" r="120" fill="url(#spark)"/>
  <g stroke="#ffb347" stroke-width="3" stroke-linecap="round">
    <line x1="452" y1="381" x2="522" y2="311"/>
    <line x1="452" y1="381" x2="542" y2="381"/>
    <line x1="452" y1="381" x2="518" y2="441"/>
    <line x1="452" y1="381" x2="482" y2="291"/>
    <line x1="452" y1="381" x2="402" y2="301"/>
    <line x1="452" y1="381" x2="392" y2="441"/>
  </g>
  <g fill="#ffcf8a">
    <circle cx="530" cy="303" r="4"/>
    <circle cx="548" cy="381" r="3.5"/>
    <circle cx="482" cy="285" r="3"/>
    <circle cx="387" cy="447" r="3"/>
    <circle cx="524" cy="447" r="3.5"/>
  </g>
  <!-- cordón de soldadura en la junta -->
  <path d="M440 366 q6 8 0 15 q8 6 12 14" stroke="#ffd79a" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
